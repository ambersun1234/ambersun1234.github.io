name = "blog"
main = "src/index.ts"
compatibility_date = "2026-08-20"

[vars]
GITHUB_OWNER = "ambersun1234"
GITHUB_REPO = "ambersun1234.github.io"
BRANCH = "master"

[[routes]]
pattern = "mcp.ambersuncreates.com"
custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "f0d02dd7-e0dc-4d71-b878-8d746859e475"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "blog-vector-index"