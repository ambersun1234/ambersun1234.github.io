name: Deploy Read-Only MCP Worker

on:
  push:
    branches:
      - master
    paths:
      - 'mcp-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Cloudflare
        working-directory: ./mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm i
          npx wrangler deploy
